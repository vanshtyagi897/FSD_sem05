<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <script>
        const student = {
            name : "Peter",
            class: "LKG",
            fee: 5000,
            address: "bsr"
        }
        document.write(student.name);
        document.write(student.class);

        document.write(JSON.stringify(student));

        //for in loop
        for(let x in student){
            document.write(student[x]+"<br>");
        }
        
        
    </script>   

</body>
</html>
