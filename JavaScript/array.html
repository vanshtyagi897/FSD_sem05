<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="para"></p>
    <script>
        const car = ["car1","car2","car3"];
        let text = " ";
        for(let i=0;i<car.length;i++){
            if(car[i]==="car2"){ continue;}
            text += car[i]+" ";
           
        }  document.getElementById('para').innerHTML=text;
    </script>
</body>
</html>
